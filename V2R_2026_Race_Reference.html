<!DOCTYPE html>
<html lang="en">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>V2R 2026 Race Reference — Lovell #888</title>
<style>
  :root{ color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:0 0 60px 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#f4f5f7; color:#1a1a1a;
    -webkit-text-size-adjust: 100%;
  }
  .stickytop {
    position:sticky; top:0; z-index:10;
  }
  header {
    background:#0b1a33; color:#fff; padding:18px 16px 14px;
  }
  header h1 { margin:0; font-size:1.15rem; line-height:1.3; }
  header .sub { font-size:0.82rem; color:#b8c4d9; margin-top:4px; }
  nav {
    display:flex; overflow-x:auto; gap:6px; padding:10px 12px;
    background:#132446; -webkit-overflow-scrolling:touch;
  }
  nav a {
    flex:0 0 auto; color:#dbe4f5; background:#1c3260; text-decoration:none;
    font-size:0.78rem; padding:7px 12px; border-radius:16px; white-space:nowrap;
  }
  nav a:active { background:#2a4680; }
  main { padding: 14px 12px 0; max-width: 900px; margin: 0 auto; }
  section { margin-bottom: 22px; }
  h2 {
    font-size:1rem; text-transform:uppercase; letter-spacing:.04em;
    color:#0b1a33; border-bottom:2px solid #0b1a33; padding-bottom:6px; margin:0 0 10px;
  }
  .card {
    background:#fff; border-radius:10px; padding:12px 14px; margin-bottom:10px;
    box-shadow:0 1px 2px rgba(0,0,0,0.08);
  }
  .flag {
    background:#fff3cd; border:1px solid #f0c36d; border-radius:8px;
    padding:8px 10px; font-size:0.82rem; margin-bottom:10px; color:#6b4e00;
  }
  table { width:100%; border-collapse: collapse; font-size:0.82rem; background:#fff; border-radius:8px; overflow:hidden;}
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid #eaeaea; vertical-align:top; }
  th { background:#0b1a33; color:#fff; font-size:0.72rem; text-transform:uppercase; letter-spacing:.03em; position: sticky; top:0;}
  tr:last-child td { border-bottom:none; }
  .role { font-size:0.72rem; color:#555; }
  .tel { color:#0a5cff; text-decoration:none; font-weight:600; white-space:nowrap; }
  .team-heading td {
    background:#e8edf7; font-weight:700; color:#0b1a33; font-size:0.78rem;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .badge { display:inline-block; padding:2px 7px; border-radius:10px; font-size:0.68rem; font-weight:700; }
  .badge-x { background:#c8f7d0; color:#146c2e; }
  .pill { font-size:0.68rem; padding:2px 6px; border-radius:8px; background:#eef1f7; color:#333; margin-left:4px;}
  .maplink { font-size:0.72rem; color:#0a5cff; text-decoration:none; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  @media (max-width:520px){ .grid2 { grid-template-columns: 1fr; } }
  .stat { background:#fff; border-radius:10px; padding:10px 12px; text-align:center; box-shadow:0 1px 2px rgba(0,0,0,0.08);}
  .stat .num { font-size:1.3rem; font-weight:800; color:#0b1a33; }
  .stat .lab { font-size:0.68rem; color:#666; text-transform:uppercase; letter-spacing:.03em; }
  .statsrow { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; }
  .statsrow .stat { flex:1 0 auto; min-width:90px; }
  textarea, input[type=text], input[type=time] {
    width:100%; padding:8px; border:1px solid #ccc; border-radius:6px; font-size:0.85rem;
    font-family: inherit;
  }
  .logrow { display:grid; grid-template-columns: 90px 1fr 90px 34px; gap:6px; margin-bottom:6px; align-items:center; }
  button {
    background:#0b1a33; color:#fff; border:none; border-radius:8px; padding:9px 14px;
    font-size:0.85rem; font-weight:600;
  }
  button.secondary { background:#e8edf7; color:#0b1a33; }
  button.del { background:#c0392b; padding:6px 10px; font-size:0.9rem; }
  .small { font-size:0.72rem; color:#777; }
  .confirmed { color:#146c2e; }
  .unconfirmed { color:#a9740b; }
  .footer-note { text-align:center; color:#999; font-size:0.7rem; padding:20px 12px 0;}
  details summary { cursor:pointer; font-weight:600; padding:6px 0; }
</style>


<style>
  #v2rGate {
    position:fixed; inset:0; background:#0b1a33; z-index:9999;
    display:flex; align-items:center; justify-content:center; padding:20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #v2rGate .box { max-width:340px; width:100%; text-align:center; }
  #v2rGate h2 { color:#fff; font-size:1.1rem; margin-bottom:6px; }
  #v2rGate p { color:#9fb3d9; font-size:0.85rem; margin-bottom:18px; }
  #v2rGate input {
    width:100%; padding:14px; border-radius:10px; border:1px solid #2a3650;
    background:#132446; color:#fff; font-size:1rem; margin-bottom:10px; text-align:center;
    box-sizing:border-box;
  }
  #v2rGate button {
    width:100%; padding:14px; border-radius:10px; border:none;
    background:#1e5fff; color:#fff; font-size:1rem; font-weight:700;
  }
  #v2rGate .err { color:#ff8080; font-size:0.82rem; margin-top:10px; min-height:1em; }
  #v2rContent { display:none; }
</style>
</head>

</div>

const V2R_STORAGE_KEY = "v2rSitePassword";

function b64ToBytes(b64) {
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function v2rDeriveKey(password, saltB64) {
  const enc = new TextEncoder();
  const salt = b64ToBytes(saltB64);
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
}

async function v2rTryUnlock(password) {

    const key = await v2rDeriveKey(password, V2R_SALT);
    const iv = b64ToBytes(V2R_IV);
    const ct = b64ToBytes(V2R_CT);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    const html = new TextDecoder().decode(plainBuf);
    const contentDiv = document.getElementById('v2rContent');
    contentDiv.innerHTML = html;
    // re-execute any script tags in the injected content (innerHTML doesn't run them)
    contentDiv.querySelectorAll('script').forEach(oldScript => {
      const newScript = document.createElement('script');
      if (oldScript.src) { newScript.src = oldScript.src; }
      else { newScript.textContent = oldScript.textContent; }
      document.body.appendChild(newScript);
    });
    document.getElementById('v2rGate').style.display = 'none';
    contentDiv.style.display = 'block';
    localStorage.setItem(V2R_STORAGE_KEY, password);
    return true;
  } catch (e) {
    return false;
  }
}

window.addEventListener('DOMContentLoaded', async () => {
  const saved = localStorage.getItem(V2R_STORAGE_KEY);
  if (saved) {
    const ok = await v2rTryUnlock(saved);
    if (!ok) localStorage.removeItem(V2R_STORAGE_KEY);
  }
  document.getElementById('v2rForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('v2rPwInput').value;
    const ok = await v2rTryUnlock(pw);
    if (!ok) {
      document.getElementById('v2rErr').textContent = 'Incorrect password — try again.';
      document.getElementById('v2rPwInput').value = '';
      document.getElementById('v2rPwInput').focus();
    }
  });
});
</script>
