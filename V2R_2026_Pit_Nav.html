<!DOCTYPE html>
<html lang="en">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>V2R Pit Nav — #888 Chase</title>
<style>
  :root{ color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body {
    margin:0; padding:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#000; color:#f2f3f5;
    -webkit-text-size-adjust: 100%;
  }
  header {
    background:#0b1a33; padding:10px 14px; display:flex; align-items:center;
    justify-content:space-between; position:sticky; top:0; z-index:20;
    border-bottom:1px solid #1c3260;
  }
  header .title { font-size:0.95rem; font-weight:700; color:#fff; }
  header a.back {
    color:#9fb3d9; text-decoration:none; font-size:0.8rem; padding:6px 10px;
    background:#132446; border-radius:8px;
  }
  main { padding:14px 14px 40px; max-width:640px; margin:0 auto; }

  .safety {
    background:#3a1a1a; border:1px solid #8a2e2e; color:#ffb3b3;
    border-radius:10px; padding:10px 12px; font-size:0.8rem; margin-bottom:14px;
    text-align:center; font-weight:600;
  }

  .progress {
    text-align:center; font-size:0.78rem; color:#8a94a6; margin-bottom:10px;
    letter-spacing:.04em; text-transform:uppercase;
  }

  .legcard {
    background:#101826; border:1px solid #232f45; border-radius:18px;
    padding:20px 18px; margin-bottom:12px;
  }
  .legcard .fromto {
    font-size:0.78rem; color:#8a94a6; text-transform:uppercase; letter-spacing:.04em;
    margin-bottom:2px;
  }
  .legcard h2 {
    font-size:1.7rem; margin:0 0 10px; color:#fff; line-height:1.15;
  }
  .biggrid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:14px; }
  .bignum { background:#1a2436; border-radius:12px; padding:10px 12px; text-align:center; }
  .bignum .val { font-size:1.5rem; font-weight:800; color:#fff; }
  .bignum .lab { font-size:0.68rem; color:#8a94a6; text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }

  a.gobtn {
    display:block; text-align:center; background:#1e5fff; color:#fff;
    text-decoration:none; font-size:1.15rem; font-weight:800; padding:18px;
    border-radius:14px; margin-bottom:10px;
  }
  a.gobtn:active { background:#144acb; }
  a.gobtn.secondary { background:#1a2436; color:#9fb3d9; font-size:0.95rem; font-weight:700; padding:14px; }

  .turnnote {
    background:#1a2436; border-left:4px solid #ffb020; border-radius:8px;
    padding:10px 12px; font-size:0.95rem; line-height:1.4; margin-bottom:10px;
  }
  .turnnote .lab { font-size:0.68rem; color:#ffb020; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; font-weight:700; }

  .flagnote {
    background:#3a2a10; border-left:4px solid #ffb020; border-radius:8px;
    padding:10px 12px; font-size:0.88rem; margin-bottom:10px; color:#ffd699;
  }

  .navrow { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin:16px 0; }
  .navrow button {
    background:#1a2436; color:#fff; border:1px solid #2a3650; border-radius:12px;
    padding:16px; font-size:1rem; font-weight:700;
  }
  .navrow button:disabled { opacity:0.35; }

  details { margin-top:18px; }
  details summary {
    cursor:pointer; font-weight:700; padding:10px 0; font-size:0.9rem; color:#9fb3d9;
  }
  .jumplist { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .jumplist button {
    text-align:left; background:#101826; border:1px solid #232f45; color:#e6e9ef;
    border-radius:10px; padding:12px 14px; font-size:0.88rem;
  }
  .jumplist button.active { border-color:#1e5fff; background:#12203e; }

  .contacts { margin-top:18px; }
  .contacts h3 { font-size:0.8rem; text-transform:uppercase; letter-spacing:.04em; color:#8a94a6; margin:0 0 8px; }
  .contactrow {
    display:flex; justify-content:space-between; align-items:center;
    background:#101826; border:1px solid #232f45; border-radius:10px;
    padding:12px 14px; margin-bottom:6px;
  }
  .contactrow .name { font-size:0.92rem; font-weight:600; }
  .contactrow .role { font-size:0.72rem; color:#8a94a6; }
  a.tel {
    color:#1e5fff; background:#1a2436; text-decoration:none; font-weight:700;
    font-size:0.85rem; padding:8px 12px; border-radius:8px; white-space:nowrap;
  }

  .closingcard {
    background:#101826; border:1px solid #232f45; border-radius:14px;
    padding:14px 16px; margin-top:18px;
  }
  .closingcard h3 { font-size:0.8rem; text-transform:uppercase; letter-spacing:.04em; color:#8a94a6; margin:0 0 8px; }
  table { width:100%; border-collapse:collapse; font-size:0.82rem; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid #1c2536; }
  th { color:#8a94a6; font-size:0.68rem; text-transform:uppercase; }
  .footer-note { text-align:center; color:#555; font-size:0.68rem; padding:24px 12px 0; }
</style>


<style>
  #v2rGate {
    position:fixed; inset:0; background:#0b1a33; z-index:9999;
    display:flex; align-items:center; justify-content:center; padding:20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #v2rGate .box { max-width:340px; width:100%; text-align:center; }
  #v2rGate h2 { color:#fff; font-size:1.1rem; margin-bottom:6px; }
  #v2rGate p { color:#9fb3d9; font-size:0.85rem; margin-bottom:18px; }
  #v2rGate input {
    width:100%; padding:14px; border-radius:10px; border:1px solid #2a3650;
    background:#132446; color:#fff; font-size:1rem; margin-bottom:10px; text-align:center;
    box-sizing:border-box;
  }
  #v2rGate button {
    width:100%; padding:14px; border-radius:10px; border:none;
    background:#1e5fff; color:#fff; font-size:1rem; font-weight:700;
  }
  #v2rGate .err { color:#ff8080; font-size:0.82rem; margin-top:10px; min-height:1em; }
  #v2rContent { display:none; }
</style>
</head>
<body>

<div id="v2rGate">
  <div class="box">
    <h2>🔒 V2R 2026 — Private</h2>
    <p>Enter the team password to continue</p>
    <form id="v2rForm">
      <input type="password" id="v2rPwInput" autocomplete="current-password" placeholder="Password" autofocus>
      <button type="submit">Unlock</button>
      <div class="err" id="v2rErr"></div>
    </form>
  </div>
</div>

<div id="v2rContent"></div>

const V2R_STORAGE_KEY = "v2rSitePassword";

function b64ToBytes(b64) {
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function v2rDeriveKey(password, saltB64) {
  const enc = new TextEncoder();
  const salt = b64ToBytes(saltB64);
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
}

async function v2rTryUnlock(password) {
  try {
    const key = await v2rDeriveKey(password, V2R_SALT);
    const iv = b64ToBytes(V2R_IV);
    const ct = b64ToBytes(V2R_CT);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    const html = new TextDecoder().decode(plainBuf);
    const contentDiv = document.getElementById('v2rContent');
    contentDiv.innerHTML = html;
    // re-execute any script tags in the injected content (innerHTML doesn't run them)
    contentDiv.querySelectorAll('script').forEach(oldScript => {
      const newScript = document.createElement('script');
      if (oldScript.src) { newScript.src = oldScript.src; }
      else { newScript.textContent = oldScript.textContent; }
      document.body.appendChild(newScript);
    });
    document.getElementById('v2rGate').style.display = 'none';
    contentDiv.style.display = 'block';
    localStorage.setItem(V2R_STORAGE_KEY, password);
    return true;
  } catch (e) {
    return false;
  }
}

window.addEventListener('DOMContentLoaded', async () => {
  const saved = localStorage.getItem(V2R_STORAGE_KEY);
  if (saved) {
    const ok = await v2rTryUnlock(saved);
    if (!ok) localStorage.removeItem(V2R_STORAGE_KEY);
  }
  document.getElementById('v2rForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('v2rPwInput').value;
    const ok = await v2rTryUnlock(pw);
    if (!ok) {
      document.getElementById('v2rErr').textContent = 'Incorrect password — try again.';
      document.getElementById('v2rPwInput').value = '';
      document.getElementById('v2rPwInput').focus();
    }
  });
});
